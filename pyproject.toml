[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reciprocal-rank"
version = "0.1.0"
description = "Reciprocal Rank Fusion (RRF) and Borda count combiner for hybrid sparse/dense retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
rag-reciprocal-rank = "rag_reciprocal_rank.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_reciprocal_rank*"]
